<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes do JapHelp</title>
  <style>
    :root { color-scheme: light dark; --ok: #1f8a4c; --bad: #c83737; }
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #resumo { font-weight: 700; margin: 8px 0 12px; }
    #resumo.ok { color: var(--ok); }
    #resumo.falhou { color: var(--bad); }
    #saida { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 0; }
  </style>
</head>
<body>
  <h1>Testes do JapHelp (celular)</h1>
  <p>Confere o app de celular: mesmos resultados do app de PC, conteúdo, furigana, ordem dos traços e arquivos do modo offline.</p>
  <div id="resumo">Rodando…</div>
  <pre id="saida"></pre>
  <script type="module" src="testes.js"></script>
</body>
</html>
